name: discord-bot

services:
  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE is required}
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/bot.sqlite
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    volumes:
      - bot-data:/app/data

  redis:
    image: redis:8.10.1-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  bot-data:
  redis-data:
