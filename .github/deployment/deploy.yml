# This file is intentionally outside .github/workflows and cannot run until
# `npm run deployment:enable` copies it there in a cloned bot repository.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOYMENT_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          missing=()
          [ -n "$AWS_ACCESS_KEY_ID" ] || missing+=("AWS_ACCESS_KEY_ID")
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing+=("AWS_SECRET_ACCESS_KEY")
          [ -n "$AWS_REGION" ] || missing+=("AWS_REGION")
          [ -n "$EC2_INSTANCE_ID" ] || missing+=("EC2_INSTANCE_ID")
          [ -n "$DISCORD_TOKEN" ] || missing+=("DISCORD_TOKEN")
          [ -n "$DISCORD_CLIENT_ID" ] || missing+=("DISCORD_CLIENT_ID")
          [ -n "$GHCR_USERNAME" ] || missing+=("GHCR_USERNAME")
          [ -n "$GHCR_TOKEN" ] || missing+=("GHCR_TOKEN")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required production secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Check out tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set deployment variables
        id: deployment
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          image_repository="$(printf '%s' 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_repository=$image_repository" >> "$GITHUB_OUTPUT"
          echo "image=$image_repository:$TESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: npm run format:check && npm run lint && npm test && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish tested image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.deployment.outputs.image }}
            ${{ steps.deployment.outputs.image_repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          BOT_IMAGE: ${{ steps.deployment.outputs.image }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          compose_file="$(base64 -w 0 compose.production.yaml)"
          ghcr_token="$(printf %s "$GHCR_TOKEN" | base64 -w 0)"
          app_env="$({
            printf '%s\n' \
              "BOT_IMAGE=$BOT_IMAGE" \
              "DISCORD_TOKEN=$DISCORD_TOKEN" \
              "DISCORD_CLIENT_ID=$DISCORD_CLIENT_ID" \
              "DATABASE_PATH=/app/data/bot.sqlite" \
              "REDIS_URL=redis://redis:6379" \
              "LOG_LEVEL=info"
          } | base64 -w 0)"

          parameters="$(jq -n \
            --arg compose_file "$compose_file" \
            --arg app_env "$app_env" \
            --arg ghcr_username "$GHCR_USERNAME" \
            --arg ghcr_token "$ghcr_token" \
            '{commands: [
              "set -eu",
              "install -d -m 0755 /opt/discord-bot",
              "if ! command -v docker >/dev/null 2>&1; then if command -v apt-get >/dev/null 2>&1; then apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io curl ca-certificates; elif command -v dnf >/dev/null 2>&1; then dnf install -y docker curl ca-certificates; elif command -v yum >/dev/null 2>&1; then yum install -y docker curl ca-certificates; else echo Unsupported package manager >&2; exit 1; fi; fi",
              "systemctl enable --now docker",
              "if ! command -v curl >/dev/null 2>&1; then if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y curl; elif command -v dnf >/dev/null 2>&1; then dnf install -y curl; else yum install -y curl; fi; fi",
              "if ! docker compose version >/dev/null 2>&1; then case $(uname -m) in x86_64|aarch64) compose_arch=$(uname -m) ;; *) echo Unsupported architecture: $(uname -m) >&2; exit 1 ;; esac; install -d -m 0755 /usr/local/lib/docker/cli-plugins; curl -fsSL https://github.com/docker/compose/releases/download/v5.1.4/docker-compose-linux-$compose_arch -o /usr/local/lib/docker/cli-plugins/docker-compose; chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose; fi",
              "docker --version",
              "docker compose version",
              ("printf %s " + ($compose_file | @sh) + " | base64 -d > /opt/discord-bot/compose.yaml.tmp"),
              "mv /opt/discord-bot/compose.yaml.tmp /opt/discord-bot/compose.yaml",
              ("printf %s " + ($app_env | @sh) + " | base64 -d > /opt/discord-bot/.env.tmp"),
              "chmod 0600 /opt/discord-bot/.env.tmp",
              "mv /opt/discord-bot/.env.tmp /opt/discord-bot/.env",
              ("printf %s " + ($ghcr_token | @sh) + " | base64 -d | docker login ghcr.io --username " + ($ghcr_username | @sh) + " --password-stdin"),
              "trap \"docker logout ghcr.io >/dev/null 2>&1 || true\" EXIT",
              "cd /opt/discord-bot",
              "docker compose pull",
              "docker compose up --detach --remove-orphans --wait --wait-timeout 60",
              "docker compose ps",
              "docker image prune --force"
            ]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Discord bot" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM command: $command_id"

          status=Pending
          for attempt in {1..120}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'

          if [ "$status" != Success ]; then
            echo "Deployment failed with SSM status: $status"
            exit 1
          fi

      - name: Deploy global slash commands
        run: npm run commands:deploy
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          REDIS_URL: redis://redis:6379
